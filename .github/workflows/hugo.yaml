# Название workflow (процесса) - видно в интерфейсе GitHub
name: Deploy Hugo site to Pages

# Когда запускать: при каждом пуше (push) в ветку main
on:
  push:
    branches:
      - main  # Если ваша основная ветка называется master, замените здесь

# Разрешает этому workflow создавать и развертывать страницы
permissions:
  contents: read
  pages: write
  id-token: write

# Защита от одновременного запуска нескольких сборок
concurrency:
  group: "pages"
  cancel-in-progress: true

# Переменные среды по умолчанию
env:
  HUGO_VERSION: '0.128.0'  # Можно изменить на актуальную версию Hugo

# Шаги, которые выполнит виртуальная машина GitHub
jobs:
  build:
    runs-on: ubuntu-latest  # Используем последний Ubuntu
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Важно для скачивания тем, добавленных как git submodule
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true  # Используем расширенную версию (поддерживает SCSS)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Сборка сайта с Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Загрузка артефакта (готовых файлов)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public  # Hugo генерирует файлы в папку public

  deploy:
    needs: build  # Запустится только после успешной сборки
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
